<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cute Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #ffd6e8;
    --bg2: #d6e6ff;
    --body: #fff8fc;
    --screen: #fff0f7;
    --num: #ffffff;
    --num-shadow: #f3c9dc;
    --op: #ffb3d1;
    --op-shadow: #f08ab4;
    --fn: #c9b8ff;
    --fn-shadow: #a994f0;
    --eq: #ff7eb6;
    --eq-shadow: #e0558f;
    --text: #6b4a63;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    font-family: 'Fredoka', system-ui, sans-serif;
    background: linear-gradient(135deg, var(--bg1), var(--bg2));
    color: var(--text);
    overflow-x: hidden;
    padding: 36px 0 24px;
  }
  @media (max-height: 820px) {
    button { height: 52px; font-size: 20px; border-radius: 16px; }
    .keys { gap: 10px; }
    .screen { min-height: 80px; margin-bottom: 14px; }
    .display { font-size: 36px; }
  }
  .float {
    position: fixed;
    font-size: 28px;
    opacity: .55;
    animation: float 6s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0); }
    50% { transform: translateY(-16px) rotate(8deg); }
  }
  .calc {
    width: min(340px, 92vw);
    background: var(--body);
    border-radius: 36px;
    padding: 22px 20px 24px;
    box-shadow: 0 20px 50px rgba(200, 120, 170, .35), inset 0 -6px 0 #ffe3f0;
    border: 4px solid #fff;
    position: relative;
  }
  .ears::before, .ears::after {
    content: '';
    position: absolute;
    top: -22px;
    width: 52px; height: 52px;
    background: var(--body);
    border: 4px solid #fff;
    border-radius: 50%;
    z-index: -1;
    box-shadow: inset 0 0 0 10px #ffd0e4;
  }
  .ears::before { left: 22px; }
  .ears::after { right: 22px; }
  .face {
    text-align: center;
    font-size: 15px;
    letter-spacing: 1px;
    margin-bottom: 8px;
    font-weight: 500;
  }
  .screen {
    background: var(--screen);
    border-radius: 22px;
    padding: 14px 18px;
    text-align: right;
    box-shadow: inset 0 4px 10px rgba(240, 138, 180, .25);
    margin-bottom: 18px;
    min-height: 100px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    overflow: hidden;
  }
  .history {
    font-size: 16px;
    opacity: .6;
    min-height: 22px;
    word-break: break-all;
  }
  .display {
    font-size: 42px;
    font-weight: 600;
    line-height: 1.15;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: clip;
  }
  .keys {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
  }
  button {
    font-family: inherit;
    font-size: 22px;
    font-weight: 500;
    color: var(--text);
    border: none;
    height: 62px;
    border-radius: 20px;
    cursor: pointer;
    background: var(--num);
    box-shadow: 0 6px 0 var(--num-shadow);
    transition: transform .08s, box-shadow .08s, filter .15s;
  }
  button:hover { filter: brightness(1.04); }
  button:active, button.pressed {
    transform: translateY(5px);
    box-shadow: 0 1px 0 var(--num-shadow);
  }
  button.op { background: var(--op); box-shadow: 0 6px 0 var(--op-shadow); color: #fff; }
  button.op:active, button.op.pressed { box-shadow: 0 1px 0 var(--op-shadow); }
  button.fn { background: var(--fn); box-shadow: 0 6px 0 var(--fn-shadow); color: #fff; }
  button.fn:active, button.fn.pressed { box-shadow: 0 1px 0 var(--fn-shadow); }
  button.eq { background: var(--eq); box-shadow: 0 6px 0 var(--eq-shadow); color: #fff; }
  button.eq:active, button.eq.pressed { box-shadow: 0 1px 0 var(--eq-shadow); }
  button.zero { grid-column: span 2; }
  button.active-op { outline: 4px solid #fff; outline-offset: -4px; filter: brightness(1.08); }
  .shake { animation: shake .35s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
  <span class="float" style="top:8%;left:10%">🌸</span>
  <span class="float" style="top:18%;right:12%;animation-delay:1s">⭐</span>
  <span class="float" style="bottom:12%;left:14%;animation-delay:2s">💖</span>
  <span class="float" style="bottom:20%;right:10%;animation-delay:3s">🍓</span>

  <div class="calc ears" id="calc">
    <div class="face">(＾◡＾) Cute Calc</div>
    <div class="screen">
      <div class="history" id="history"></div>
      <div class="display" id="display">0</div>
    </div>
    <div class="keys" id="keys">
      <button class="fn" data-act="clear">AC</button>
      <button class="fn" data-act="sign">±</button>
      <button class="fn" data-act="percent">%</button>
      <button class="op" data-op="÷">÷</button>

      <button data-num="7">7</button>
      <button data-num="8">8</button>
      <button data-num="9">9</button>
      <button class="op" data-op="×">×</button>

      <button data-num="4">4</button>
      <button data-num="5">5</button>
      <button data-num="6">6</button>
      <button class="op" data-op="−">−</button>

      <button data-num="1">1</button>
      <button data-num="2">2</button>
      <button data-num="3">3</button>
      <button class="op" data-op="+">+</button>

      <button class="zero" data-num="0">0</button>
      <button data-act="dot">.</button>
      <button class="eq" data-act="equals">=</button>
    </div>
  </div>

<script>
(function () {
  const displayEl = document.getElementById('display');
  const historyEl = document.getElementById('history');
  const calcEl = document.getElementById('calc');

  let current = '0';       // number being typed
  let previous = null;     // stored left operand (number)
  let operator = null;     // pending operator
  let justEvaluated = false;
  let error = false;
  let awaitingSecond = false;  // true right after pressing an operator

  const fmt = (s) => {
    if (error) return s;
    if (s === '-' ) return s;
    const neg = s.startsWith('-');
    let [int, dec] = s.replace('-', '').split('.');
    int = int.replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + int + (dec !== undefined ? '.' + dec : '');
  };

  function render() {
    const text = fmt(current);
    displayEl.textContent = text;
    const len = text.length;
    displayEl.style.fontSize = len > 14 ? '22px' : len > 11 ? '28px' : len > 8 ? '34px' : '42px';
    document.querySelectorAll('button.op').forEach(b =>
      b.classList.toggle('active-op', awaitingSecond && b.dataset.op === operator));
  }

  function toStr(n) {
    if (!isFinite(n)) return null;
    let s = String(parseFloat(n.toPrecision(12)));
    if (s.includes('e')) s = n.toExponential(6);
    return s;
  }

  function compute(a, b, op) {
    switch (op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? NaN : a / b;
    }
    return b;
  }

  function showError() {
    error = true;
    current = 'Oops! 🙈';
    previous = null; operator = null;
    historyEl.textContent = '';
    calcEl.classList.remove('shake');
    void calcEl.offsetWidth;
    calcEl.classList.add('shake');
    render();
  }

  function clearAll() {
    current = '0'; previous = null; operator = null;
    justEvaluated = false; error = false;
    historyEl.textContent = '';
    render();
  }

  function inputNum(d) {
    if (error) clearAll();
    if (awaitingSecond) { current = '0'; awaitingSecond = false; }
    if (justEvaluated) { current = '0'; justEvaluated = false; historyEl.textContent = ''; }
    if (current === '0') current = d;
    else if (current.replace(/[-.]/g, '').length < 15) current += d;
    render();
  }

  function inputDot() {
    if (error) clearAll();
    if (awaitingSecond) { current = '0'; awaitingSecond = false; }
    if (justEvaluated) { current = '0'; justEvaluated = false; historyEl.textContent = ''; }
    if (!current.includes('.')) current += '.';
    render();
  }

  function setOperator(op) {
    if (error) return;
    const val = parseFloat(current);
    if (operator && !justEvaluated && previous !== null && !awaitingSecond) {
      const res = compute(previous, val, operator);
      if (isNaN(res)) return showError();
      previous = res;
      current = toStr(res);
    } else {
      previous = val;
    }
    operator = op;
    justEvaluated = false;
    awaitingSecond = true;
    historyEl.textContent = fmt(toStr(previous)) + ' ' + op;
    render();
  }

  function equals() {
    if (error || operator === null || previous === null) return;
    const b = parseFloat(current);
    const res = compute(previous, b, operator);
    if (isNaN(res)) return showError();
    historyEl.textContent = fmt(toStr(previous)) + ' ' + operator + ' ' + fmt(toStr(b)) + ' =';
    current = toStr(res);
    previous = null; operator = null;
    awaitingSecond = false;
    justEvaluated = true;
    render();
  }

  function sign() {
    if (error || current === '0') return;
    current = current.startsWith('-') ? current.slice(1) : '-' + current;
    render();
  }

  function percent() {
    if (error) return;
    current = toStr(parseFloat(current) / 100);
    render();
  }

  function backspace() {
    if (error || justEvaluated || awaitingSecond) return;
    current = current.length > 1 && !(current.length === 2 && current.startsWith('-'))
      ? current.slice(0, -1) : '0';
    render();
  }

  document.getElementById('keys').addEventListener('click', (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.dataset.num !== undefined) inputNum(b.dataset.num);
    else if (b.dataset.op) setOperator(b.dataset.op);
    else {
      switch (b.dataset.act) {
        case 'clear': clearAll(); break;
        case 'sign': sign(); break;
        case 'percent': percent(); break;
        case 'dot': inputDot(); break;
        case 'equals': equals(); break;
      }
    }
  });

  // Keyboard support
  const opMap = { '+': '+', '-': '−', '*': '×', '/': '÷' };
  function flash(selector) {
    const b = document.querySelector(selector);
    if (!b) return;
    b.classList.add('pressed');
    setTimeout(() => b.classList.remove('pressed'), 110);
  }
  document.addEventListener('keydown', (e) => {
    const k = e.key;
    if (/^[0-9]$/.test(k)) { inputNum(k); flash(`[data-num="${k}"]`); }
    else if (k === '.' || k === ',') { inputDot(); flash('[data-act="dot"]'); }
    else if (opMap[k]) { e.preventDefault(); setOperator(opMap[k]); flash(`[data-op="${opMap[k]}"]`); }
    else if (k === 'Enter' || k === '=') { e.preventDefault(); equals(); flash('[data-act="equals"]'); }
    else if (k === 'Backspace') { backspace(); }
    else if (k === 'Escape' || k === 'Delete') { clearAll(); flash('[data-act="clear"]'); }
    else if (k === '%') { percent(); flash('[data-act="percent"]'); }
  });

  render();
})();
</script>
</body>
</html>
